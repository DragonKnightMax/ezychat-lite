# electron-builder config for EzyChat Lite (run from apps/desktop: `npm run dist`).
# Prerequisites (done by the dist script): web build (apps/web/dist), server bundle
# (dist/server/server.cjs via scripts/bundle-server.mjs), the shell build (dist/main.js and
# dist/renderer via apps/desktop/scripts/build.mjs), cloudflared (apps/desktop/scripts/fetch-cloudflared.mjs)
# and WinSW (apps/desktop/scripts/fetch-winsw.mjs).
appId: org.ossmalaysia.wateaminbox
productName: EzyChat Lite
copyright: Copyright © OSS Malaysia and contributors
artifactName: EzyChat-Lite-${version}-${os}-${arch}.${ext}

directories:
  output: release
  buildResources: build

files:
  - package.json
  - dist/**/*
  - '!dist/**/*.map'
  # type declarations are for the npm package only
  - '!dist/**/*.d.ts'
  - '!dist/**/*.d.cts'
  # better-sqlite3 ships prebuilt binaries; its C sources are only needed to compile from source
  - '!**/node_modules/better-sqlite3/{deps,src}/**'
  - '!**/node_modules/better-sqlite3/binding.gyp'

asar: true
asarUnpack:
  - '**/*.node'
  # whole native packages (JS loaders + binaries) so the server also runs from
  # app.asar.unpacked/dist/server/server.cjs with plain module resolution
  - '**/node_modules/better-sqlite3/**'
  - '**/node_modules/@node-rs/**'
  # voice notes: sherpa-onnx-node loader + its platform package (sherpa-onnx.node with the
  # onnxruntime/sherpa .dll/.dylib/.so libraries it loads from the same folder)
  - '**/node_modules/sherpa-onnx-node/**'
  - '**/node_modules/sherpa-onnx-*/**'
  - '**/server/**'
  # server launcher (forked / run by the OS service, like server.cjs)
  - 'dist/server-host.cjs'
  # read by the server for its version (<server dir>/../package.json)
  - 'dist/package.json'

# Native modules: better-sqlite3 (v12+), @node-rs/argon2 and sherpa-onnx-node are Node-API addons
# with prebuilt binaries, so the same build loads in Node (tests) and in Electron (utilityProcess /
# ELECTRON_RUN_AS_NODE=1). No Electron rebuild needed; rebuilding would also touch the shared
# workspace node_modules used by the server tests.
npmRebuild: false

extraResources:
  - from: build/icon.png
    to: app-icon.png
  - from: ../web/dist
    to: web
  # tray icons (tray.png on Windows/Linux, trayTemplate.png on macOS); read via process.resourcesPath
  - from: build/tray
    to: tray
    filter: ['*.png']

win:
  icon: build/icon.ico
  # Keep the binary path referenced by existing Windows service configurations.
  executableName: EzyChat Lite
  # Our own hook signs every file when WIN_SIGN_MODE is set (Azure Artifact Signing in release.yml,
  # signtool with a certificate, or a vendor command); without it the build stays unsigned. See
  # scripts/sign-windows.cjs.
  signtoolOptions:
    sign: ../../scripts/sign-windows.cjs
  target:
    - target: nsis
      arch: [x64]
  extraResources:
    - from: ../../resources/cloudflared/win32-x64
      to: cloudflared
      filter: ['cloudflared.exe']
    - from: ../../resources/winsw
      to: winsw
      filter: ['WinSW-x64.exe']

nsis:
  oneClick: false
  # per-machine install so the LocalSystem service can read the app files
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: EzyChat Lite
  deleteAppDataOnUninstall: false

mac:
  icon: build/icon.png
  category: public.app-category.business
  # No Apple Developer ID yet: sign ad-hoc ('-'). With identity null the bundle was never signed (only
  # the linker's signature on the executable), and Apple Silicon reports such an app as "damaged".
  # Ad-hoc signing seals the whole bundle; macOS then shows the normal "unidentified developer"
  # prompt (System Settings -> Privacy & Security -> Open Anyway).
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: '-'
  # macOS asks before the microphone is used for a voice note; without this text it refuses.
  extendInfo:
    NSMicrophoneUsageDescription: EzyChat Lite uses the microphone only while you record a voice note.
  # No arch list: a local `npm run dist` builds this Mac's own architecture. Native packages
  # (@node-rs/argon2, sherpa-onnx) are installed for the host only, so a cross-built Intel app would
  # have no server. The release workflow builds each architecture on its own runner (dmg:<arch>).
  target:
    - target: dmg
  extraResources:
    - from: ../../resources/cloudflared/darwin-${arch}
      to: cloudflared
      filter: ['cloudflared']

dmg:
  title: EzyChat Lite ${version}

linux:
  icon: build/icon.png
  category: Network
  target: [AppImage]
  extraResources:
    - from: ../../resources/cloudflared/linux-${arch}
      to: cloudflared
      filter: ['cloudflared']
